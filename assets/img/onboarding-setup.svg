<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea0070" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7000ea" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea0070"/>
      <stop offset="100%" stop-color="#ff3399"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Background -->
  <rect width="800" height="600" rx="24" fill="#09090b"/>
  <circle cx="400" cy="300" r="260" fill="url(#bg-glow)"/>

  <!-- Grid Base Platform -->
  <ellipse cx="400" cy="480" rx="320" ry="60" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <ellipse cx="400" cy="480" rx="220" ry="40" fill="none" stroke="#ea0070" stroke-opacity="0.3" stroke-dasharray="6 6"/>

  <!-- Studio Main Display Console -->
  <g transform="translate(180, 140)">
    <!-- Monitor Outer Frame -->
    <rect x="0" y="0" width="440" height="280" rx="16" fill="url(#screen-grad)" stroke="#27272a" stroke-width="2"/>
    <!-- Top Window Bar -->
    <rect x="0" y="0" width="440" height="32" rx="16" fill="#1f1f23"/>
    <circle cx="20" cy="16" r="4" fill="#ef4444"/>
    <circle cx="36" cy="16" r="4" fill="#f59e0b"/>
    <circle cx="52" cy="16" r="4" fill="#10b981"/>
    <rect x="160" y="10" width="120" height="12" rx="6" fill="#27272a"/>

    <!-- Screen Content: Film Strip & Channels -->
    <!-- Film Track 1 -->
    <rect x="24" y="52" width="392" height="64" rx="8" fill="#111115" stroke="#27272a"/>
    <rect x="36" y="64" width="70" height="40" rx="4" fill="#ea0070" fill-opacity="0.2" stroke="#ea0070"/>
    <rect x="118" y="64" width="120" height="40" rx="4" fill="#27272a"/>
    <rect x="250" y="64" width="80" height="40" rx="4" fill="#7000ea" fill-opacity="0.2" stroke="#7000ea"/>
    <rect x="342" y="64" width="60" height="40" rx="4" fill="#27272a"/>

    <!-- Timeline Playhead -->
    <line x1="160" y1="44" x2="160" y2="124" stroke="#ea0070" stroke-width="2"/>
    <polygon points="154,44 166,44 160,52" fill="#ea0070"/>

    <!-- Lane Cards / Department Nodes -->
    <rect x="24" y="132" width="120" height="120" rx="8" fill="#111115" stroke="#27272a"/>
    <circle cx="84" cy="168" r="18" fill="#ea0070" fill-opacity="0.2"/>
    <path d="M78 168 L88 162 L88 174 Z" fill="#ea0070"/>
    <rect x="40" y="200" width="88" height="8" rx="4" fill="#f4f4f5" fill-opacity="0.8"/>
    <rect x="52" y="216" width="64" height="6" rx="3" fill="#a1a1aa" fill-opacity="0.5"/>

    <rect x="160" y="132" width="120" height="120" rx="8" fill="#111115" stroke="#ea0070" stroke-width="1.5"/>
    <circle cx="220" cy="168" r="18" fill="url(#accent-grad)"/>
    <path d="M214 168 L226 168 M220 162 L220 174" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <rect x="176" y="200" width="88" height="8" rx="4" fill="#f4f4f5"/>
    <rect x="188" y="216" width="64" height="6" rx="3" fill="#ea0070" fill-opacity="0.8"/>

    <rect x="296" y="132" width="120" height="120" rx="8" fill="#111115" stroke="#27272a"/>
    <circle cx="356" cy="168" r="18" fill="#7000ea" fill-opacity="0.2"/>
    <rect x="348" y="160" width="16" height="16" rx="3" fill="#7000ea"/>
    <rect x="312" y="200" width="88" height="8" rx="4" fill="#f4f4f5" fill-opacity="0.8"/>
    <rect x="324" y="216" width="64" height="6" rx="3" fill="#a1a1aa" fill-opacity="0.5"/>

    <!-- Stand base -->
    <rect x="195" y="280" width="50" height="40" fill="#1f1f23"/>
    <rect x="160" y="320" width="120" height="10" rx="5" fill="#27272a"/>
  </g>

  <!-- Creator Character (Left) -->
  <g transform="translate(100, 260)">
    <!-- Body & Clothing -->
    <path d="M60 180 C50 140, 30 110, 60 90 C80 90, 90 100, 100 120 C110 100, 120 90, 140 90 C170 110, 150 140, 140 180 Z" fill="#1f1f23"/>
    <!-- Head & Hair -->
    <circle cx="100" cy="50" r="28" fill="#f4f4f5"/>
    <path d="M72 45 C75 20, 115 15, 125 35 C130 50, 120 60, 115 65 C110 45, 85 40, 72 45 Z" fill="#ea0070"/>
    <!-- Arm Gesturing towards Screen -->
    <path d="M120 110 C150 110, 180 80, 200 90" stroke="#f4f4f5" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="204" cy="90" r="8" fill="#ea0070"/>
  </g>

  <!-- Floating Cinematic Elements (Right) -->
  <g transform="translate(630, 200)">
    <!-- Clapperboard -->
    <rect x="0" y="20" width="70" height="55" rx="6" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <rect x="0" y="20" width="70" height="14" fill="#27272a"/>
    <line x1="14" y1="20" x2="22" y2="34" stroke="#ffffff" stroke-width="2"/>
    <line x1="34" y1="20" x2="42" y2="34" stroke="#ffffff" stroke-width="2"/>
    <line x1="54" y1="20" x2="62" y2="34" stroke="#ffffff" stroke-width="2"/>
    <polygon points="26,46 44,56 26,66" fill="#ea0070"/>

    <!-- Lens / Orbit Asset -->
    <circle cx="40" cy="140" r="30" fill="#18181b" stroke="#7000ea" stroke-width="2"/>
    <circle cx="40" cy="140" r="18" fill="#ea0070" fill-opacity="0.3"/>
    <circle cx="40" cy="140" r="8" fill="#f4f4f5"/>
  </g>
</svg>
