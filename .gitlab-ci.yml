default:
  image: node:22-alpine

stages:
  - test
  - security
  - build

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - web/package-lock.json
  paths:
    - .npm/

typecheck:
  stage: test
  script:
    - cd web
    - npm ci
    - npm run typecheck

lint:
  stage: test
  script:
    - cd web
    - npm ci
    - npm run lint

unit-tests:
  stage: test
  script:
    - cd web
    - npm ci
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: web/coverage/cobertura-coverage.xml

e2e-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.50.0-noble
  script:
    - cd web
    - npm ci
    - npx playwright test
  artifacts:
    when: on_failure
    paths:
      - web/playwright-report/
      - web/test-results/
migration-tests:
  stage: test
  image: postgres:16-alpine
  before_script:
    - apk add --no-cache bash su-exec
    - mkdir -p /run/postgresql && chown postgres:postgres /run/postgresql
  script:
    - |
      chown -R postgres:postgres "$CI_PROJECT_DIR/supabase"
      su-exec postgres bash -c '
        set -eu
        export PGDATA=/tmp/pgdata
        initdb -U postgres -A trust >/dev/null
        pg_ctl -D "$PGDATA" -o "-c listen_addresses=" -w start >/dev/null
        trap "pg_ctl -D $PGDATA -m fast stop >/dev/null" EXIT
        psql -U postgres -v ON_ERROR_STOP=1 -q -f "$CI_PROJECT_DIR/supabase/tests/bootstrap.sql"
        for migration in "$CI_PROJECT_DIR"/supabase/migrations/*.sql; do
          echo "checking $(basename "$migration")"
          psql -U postgres -v ON_ERROR_STOP=1 -q -f "$migration"
        done
        psql -U postgres -v ON_ERROR_STOP=1 -q -f "$CI_PROJECT_DIR/supabase/tests/studio_invariants.sql"
        sh "$CI_PROJECT_DIR/supabase/tests/storage_quota_concurrency.sh"
        echo "migration invariants passed"
      '

security-gate:
  stage: security
  image: alpine:latest
  before_script:
    - apk add --no-cache bash python3 git findutils
  script:
    - bash scripts/security-gate.sh
    - bash scripts/structure-audit.sh

dependency-audit:
  stage: security
  script:
    - cd web
    - npm ci
    - npm audit --omit=dev --audit-level=high
production-build:
  stage: build
  script:
    - cd web
    - npm ci
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
