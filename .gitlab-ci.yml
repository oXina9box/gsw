default:
  image: node:22-alpine

stages:
  - test
  - security
  - build

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - web/package-lock.json
  paths:
    - .npm/

typecheck:
  stage: test
  script:
    - cd web
    - npm ci
    - npm run typecheck

lint:
  stage: test
  script:
    - cd web
    - npm ci
    - npm run lint

unit-tests:
  stage: test
  script:
    - cd web
    - npm ci
    - npm test

migration-tests:
  stage: test
  image: postgres:16-alpine
  variables:
    PGDATA: /tmp/pgdata
  before_script:
    - apk add --no-cache bash
  script:
    - initdb -U postgres -A trust >/dev/null
    - pg_ctl -o "-c listen_addresses=" -w start >/dev/null
    - trap "pg_ctl -m fast stop >/dev/null" EXIT
    - psql -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/bootstrap.sql
    - for migration in supabase/migrations/*.sql; do echo "checking $(basename "$migration")"; psql -U postgres -v ON_ERROR_STOP=1 -q -f "$migration"; done
    - psql -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/studio_invariants.sql
    - sh supabase/tests/storage_quota_concurrency.sh
    - echo "migration invariants passed"

security-gate:
  stage: security
  image: alpine:latest
  before_script:
    - apk add --no-cache bash
  script:
    - bash scripts/security-gate.sh
    - bash scripts/structure-audit.sh

production-build:
  stage: build
  script:
    - cd web
    - npm ci
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
