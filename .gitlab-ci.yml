default:
  image: node:22-alpine

stages:
  - test
  - security
  - build

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - web/package-lock.json
  paths:
    - .npm/

typecheck:
  stage: test
  script:
    - cd web
    - npm ci
    - npm run typecheck

lint:
  stage: test
  script:
    - cd web
    - npm ci
    - npm run lint

unit-tests:
  stage: test
  script:
    - cd web
    - npm ci
    - npm test

migration-tests:
  stage: test
  image: postgres:16-alpine
  before_script:
    - apk add --no-cache bash nodejs npm
  script:
    - bash scripts/test-migrations.sh

security-gate:
  stage: security
  image: alpine:latest
  before_script:
    - apk add --no-cache bash
  script:
    - bash scripts/security-gate.sh
    - bash scripts/structure-audit.sh

production-build:
  stage: build
  script:
    - cd web
    - npm ci
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
